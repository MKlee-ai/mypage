<!DOCTYPE html>
<html lang="ko" style="color-scheme: light only;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>띵뀨 | 자기소개</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #b3d9f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    .card {
      background: #ffffff;
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 60px 50px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(60, 120, 170, 0.18);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #cde5f5;
      border: 4px solid #ffffff;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(60, 120, 170, 0.2);
    }

    .profile-img svg {
      width: 60px;
      height: 60px;
      color: #6aaac8;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a3a50;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 0.95rem;
      color: #3a5f78;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(60, 120, 170, 0.25);
    }

    .btn-email {
      background-color: #e8f4fc;
      color: #1a4d6e;
      border: 1.5px solid #a8d0e8;
    }

    .btn-blog {
      background-color: #03c75a;
      color: #ffffff;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #a8d0e8;
      margin: 0 auto 36px;
      border-radius: 2px;
    }

  </style>
</head>
<body>
  <div class="card">
    <div class="profile-img">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>

    <h1>띵뀨</h1>
    <div class="divider"></div>
    <p class="bio">먹고, 걷고, 머문 공간을 기록합니다.</p>

    <div class="links">
      <a href="mailto:audrms5745@gmail.com" class="btn btn-email">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        audrms5745@gmail.com
      </a>
      <a href="https://blog.naver.com/felix_the_one" target="_blank" rel="noopener noreferrer" class="btn btn-blog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 5h18v14H3V5zm9 2L6 11h3v4h6v-4h3l-6-4z"/>
        </svg>
        네이버 블로그
      </a>
    </div>
  </div>
</body>
</html>
